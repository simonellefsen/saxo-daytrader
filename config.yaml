app:
  project_name: saxo-daytrader-xai
  environment: local
  dry_run: false
  simulation_mode: true
  launch_scheduler_with_dashboard: true
  scheduler_restart_on_failure: true
  scheduler_max_restarts: 3
  scheduler_restart_delay_seconds: 2.0

portfolio:
  base_currency: DKK
  source_csv: ""
  database_path: ledger.db
  initial_cash_dkk: 250000.0
  virtual_cap_dkk: 250000.0

market_data:
  refresh_interval_seconds: 300
  request_timeout_seconds: 10
  watchlists:
    nordic_limit: 50
    global_limit: 100
  rss:
    market_feeds:
      - name: Yahoo Finance
        url: https://finance.yahoo.com/news/rssindex
      - name: CNBC Markets
        url: https://www.cnbc.com/id/10001147/device/rss/rss.html
      - name: Reuters Business
        url: https://feeds.reuters.com/reuters/businessNews
    macro_feeds:
      - name: ECB Press
        url: https://www.ecb.europa.eu/rss/press.html
      - name: Federal Reserve Press
        url: https://www.federalreserve.gov/feeds/press_all.xml

price_monitor:
  enabled: true
  poll_interval_minutes: 1
  post_close_grace_minutes: 15
  reset_hour_local: 6
  timezone: Europe/Copenhagen
  history_max_rows: 0
  history_retention_days: 0

analysis_windows:
  offset_minutes_after_open: 60
  duration_minutes: 45
  pre_sync_minutes_before_analysis: 5
  close_offset_minutes_before_close: 60
  calendar_refresh_interval_minutes: 360
  calendar_lookback_days: 7
  calendar_lookahead_days: 45

scheduler:
  enabled: true
  poll_interval_minutes: 10
  startup_run: true
  history_max_rows: 250
  history_retention_days: 30

execution:
  #mode: simulation
  mode: live
  adapter: saxo
  auto_execute_simulation: true
  #require_approval_live: true
  require_approval_live: false
  min_trade_value_dkk: 500
  max_daily_orders: 6

risk:
  excluded_symbols: []
  excluded_symbols_csv: ENV:RISK_EXCLUDED_SYMBOLS
  max_position_weight: 0.15
  allow_shorting: false

taxation:
  share_income:
    currency: DKK
    brackets:
      - up_to_dkk: 79000
        rate: 0.27
      - up_to_dkk:
        rate: 0.42

commissions:
  default_rate: 0.0008
  fx_conversion_rate: 0.0025
  minimums:
    XCSE:
      currency: DKK
      amount: 14.0
    XNAS:
      currency: USD
      amount: 3.0
    XNYS:
      currency: USD
      amount: 3.0
    XLON:
      currency: GBP
      amount: 3.0
    XMIL:
      currency: EUR
      amount: 3.0

xai:
  api_key: ENV:XAI_API_KEY
  base_url: https://api.x.ai/v1
  model: grok-4-fast-reasoning
  goal: >
    Target average DKK 500 per trading day (DKK 3,500/week) before tax;
    stretch goal DKK 1,000/day. Maximise portfolio value while keeping
    risk reasonable for a day-trading horizon.
  timeout_seconds: 120
  auto_run_interval_minutes: 240
  include_encrypted_reasoning: false

saxo:
  environment: SIM
  client_id: ENV:SAXO_CLIENT_ID
  client_secret: ENV:SAXO_CLIENT_SECRET
  client_key: ENV:SAXO_CLIENT_KEY
  account_key: ENV:SAXO_ACCOUNT_KEY
  session_path: .secrets/saxo_session.json

tradingview:
  username: ENV:TRADINGVIEW_USERNAME
  encrypted_password: ENV:TRADINGVIEW_PASSWORD
  totp_secret: ENV:TRADINGVIEW_TOTP_SECRET

openfigi:
  enabled: true
  api_key: ENV:OPENFIGI_API_KEY
  base_url: https://api.openfigi.com/v3
  timeout_seconds: 10

notifications:
  daily_summary_enabled: false
  weekly_summary_enabled: false
  monthly_summary_enabled: false
  quarterly_summary_enabled: false
  ytd_summary_enabled: false
  timezone: Europe/Copenhagen
  dispatch_hour_local: 18
  dispatch_minute_local: 15
  weekly_dispatch_weekday_local: 0
  monthly_dispatch_day_local: 1
  quarterly_dispatch_day_local: 1
  ytd_dispatch_day_local: 1
  retry_backoff_minutes: 30
  max_attempts_per_day: 3
  channel_cooldown_minutes: 240
  summary_style: structured
  slack:
    enabled: true
    webhook_url: ENV:SLACK_WEBHOOK_URL
  email:
    enabled: false
    smtp_host: ENV:SMTP_HOST
    smtp_port: ENV:SMTP_PORT
    use_starttls: true
    username: ENV:SMTP_USERNAME
    password: ENV:SMTP_PASSWORD
    from_address: ENV:SMTP_FROM_ADDRESS
    to_addresses_csv: ENV:SMTP_TO_ADDRESSES
  alerts:
    execution_success_enabled: true
    execution_warning_enabled: true
    broker_fill_enabled: false
    broker_reject_enabled: false
    broker_cancel_enabled: false
    execution_failure_enabled: true
    broker_management_failure_enabled: true
  alert_suppression:
    enabled: true
    low_cooldown_minutes: 240
    medium_cooldown_minutes: 60
    high_cooldown_minutes: 0
  alert_grouping:
    enabled: true
    max_items_per_group: 5
  route_profiles: {}
  routes:
    daily: {}
    weekly: {}
    monthly: {}
    quarterly: {}
    ytd: {}
    alert_execution_success: {}
    alert_execution_warning: {}
    alert_broker_fill: {}
    alert_broker_reject: {}
    alert_broker_cancel: {}
    alert_broker_grouped: {}
    alert_execution_failed: {}
    alert_broker_management_failed: {}
