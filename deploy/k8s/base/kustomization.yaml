apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saxo

resources:
  - namespace.yaml
  - pvc.yaml
  - api.yaml
  - scheduler.yaml
  - frontend.yaml
  - postgres-backup-schedule.yaml
  - postgres-backup-retention.yaml

configMapGenerator:
  - name: daytrader-config
    files:
      - config.yaml=config.k8s.yaml

generatorOptions:
  disableNameSuffixHash: true
