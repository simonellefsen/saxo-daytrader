apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytrader-frontend
  labels:
    app: daytrader-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app: daytrader-frontend
  template:
    metadata:
      labels:
        app: daytrader-frontend
    spec:
      containers:
        - name: frontend
          image: daytrader-frontend:local
          imagePullPolicy: IfNotPresent
          env:
            - name: API_BASE_URL
              value: http://daytrader-api:8000
            - name: NEXT_PUBLIC_API_BASE_URL
              value: ""
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: daytrader-frontend
spec:
  selector:
    app: daytrader-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: daytrader-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: daytrader-frontend
